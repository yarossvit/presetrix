<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presetrix — Lightroom Presets</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- БАННЕР РАСПРОДАЖИ -->
  <div class="sale-banner">
    <span data-i18n="saleBannerText">🔥 Sale! 35% OFF on all preset packs — Use code ETSY35</span>
  </div>

  <div class="top-controls">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ua">UA</button>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle Theme">🌙</button>
  </div>

  <header>
    <img src="images/Logo_Black.png" alt="Presetrix" class="logo" id="logoImg">
    <div class="eyebrow" data-i18n="eyebrow">Mobile & Desktop Lightroom Presets</div>
    <h1>Presetrix</h1>
    <p data-i18n="heroText">Ready-to-use presets for every mood.</p>
  </header>

  <section class="carousel-section">
    <div class="carousel-wrap" id="carouselWrap">
      <button class="nav-btn nav-left" aria-label="Previous">&#10094;</button>
      <div class="carousel" id="carousel"></div>
      <button class="nav-btn nav-right" aria-label="Next">&#10095;</button>
    </div>
  </section>

  <section class="ba-section">
    <div class="ba-inner">
      <div class="section-title" data-i18n="baTitle">Before / After</div>
      <div class="section-sub" data-i18n="baSub">Drag the slider to see the difference</div>
      <div class="ba-container" id="baContainer">
        <img src="images/after.jpg" class="ba-img ba-after" alt="After">
        <div class="ba-before-wrap" id="baBeforeWrap">
          <img src="images/before.jpg" class="ba-img ba-before" id="baBeforeImg" alt="Before">
        </div>
        <span class="ba-label ba-label-before" data-i18n="baBefore">Before</span>
        <span class="ba-label ba-label-after" data-i18n="baAfter">After</span>
        <div class="ba-handle" id="baHandle">
          <div class="ba-handle-circle">&#8596;</div>
        </div>
      </div>
    </div>
  </section>

  <section class="bestseller-section">
    <div class="bestseller-inner">
      <div class="section-title" data-i18n="bestsellerTitle">Best Sellers</div>
      <div class="section-sub" data-i18n="bestsellerSub">The most popular packs</div>
      <div class="bestseller-grid" id="bestsellerGrid"></div>
    </div>
  </section>

  <section class="catalog-section">
    <div class="catalog-inner">
      <div class="section-title" data-i18n="catalogTitle">All Packs</div>
      <div class="section-sub" data-i18n="catalogSub">Click Buy on Etsy</div>
      <div class="filter-tabs" id="filterTabs"></div>
      <div class="catalog-grid" id="catalogGrid"></div>
      <div class="show-more-wrap" id="showMoreWrap">
        <button class="show-more-btn" id="showMoreBtn">Show more</button>
      </div>
    </div>
  </section>

  <footer>

    <span data-i18n="footerText">© Presetrix</span>
  </footer>

  <script src="packs-data.js"></script>
  <script src="main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const bestsellerGrid = document.getElementById('bestsellerGrid');
      function createCardHTML(pack, isBestseller = false) {
        const priceHtml = pack.oldPrice 
          ? `<span style="text-decoration: line-through; color: var(--muted); margin-right: 8px; font-size: 0.85rem;">${pack.oldPrice}</span> <span style="color: var(--accent); font-weight: bold;">${pack.price}</span>`
          : `${pack.price}`;

        return `
          <div class="shop-card ${isBestseller ? 'bestseller-card' : ''}">
            ${isBestseller ? '<div class="bestseller-ribbon">Hit</div>' : ''}
            <img src="images/${pack.image}" alt="${pack.name}" loading="lazy">
            <div class="info">
              <div class="name">${pack.name}</div>
              <div class="price">${priceHtml}</div>
              <a href="${pack.etsyUrl}" target="_blank" rel="noopener" class="buy-btn" data-i18n="buyBtn">Buy on Etsy</a>
            </div>
          </div>
        `;
      }
      if (bestsellerGrid && typeof PACKS !== 'undefined') {
        const bestsellers = PACKS.filter(p => p.bestseller);
        bestsellerGrid.innerHTML = bestsellers.map(p => createCardHTML(p, true)).join('');
      }
    });
  </script>
  <script>
    const themeBtn = document.getElementById('themeBtn');
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      let theme = document.documentElement.getAttribute('data-theme');
      if (theme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });
  </script>

</body>
</html>
