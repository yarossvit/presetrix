<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presetrix — Lightroom Presets (Light)</title>
<style>
  :root{
    --bg:#faf8f4;
    --bg-soft:#f1ede4;
    --card:#ffffff;
    --accent:#b97a4a;
    --accent-soft:#a8663a;
    --text:#242220;
    --muted:#847e73;
    --border:rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Georgia','Times New Roman',serif;
  }
  a{color:inherit;text-decoration:none;}

  /* ---------- HERO ---------- */
  header{
    text-align:center;
    padding:80px 20px 40px;
  }
  .logo{
    width:72px;
    height:72px;
    object-fit:contain;
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:Arial,sans-serif;
    font-size:0.75rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
  }
  h1{
    font-size:2.6rem;
    font-weight:400;
    letter-spacing:1px;
    margin:0 0 14px;
  }
  header p{
    font-family:Arial,sans-serif;
    color:var(--muted);
    font-size:0.95rem;
    max-width:480px;
    margin:0 auto;
    letter-spacing:0.3px;
  }

  /* ---------- CAROUSEL ---------- */
  .carousel-section{
    padding:20px 0 60px;
  }
  .carousel-wrap{
    position:relative;
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:0 20px;
  }
  .carousel{
    display:flex;
    gap:24px;
    overflow-x:auto;
    scroll-behavior:auto;
    padding:20px 10px 30px 10px;
    scrollbar-width:none;
    -ms-overflow-style:none;
    user-select:none;
  }
  .carousel::-webkit-scrollbar{display:none;}

  .card{
    flex:0 0 auto;
    width:200px;
    border-radius:10px;
    overflow:hidden;
    background:var(--card);
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    transition:transform .25s ease, box-shadow .25s ease;
    display:block;
  }
  .card:hover{
    transform:translateY(-6px);
    box-shadow:0 14px 30px rgba(0,0,0,0.55);
  }
  .card img{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .card .label{
    padding:10px 12px;
    font-family:Arial,sans-serif;
    font-size:0.75rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
  }

  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(20,20,20,0.75);
    border:1px solid var(--border);
    color:#f2efe9;
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:1.2rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    transition:background .2s;
  }
  .nav-btn:hover{background:rgba(217,160,102,0.85);}
  .nav-left{left:0;}
  .nav-right{right:0;}

  /* ---------- CATALOG ---------- */
  .catalog-section{
    padding:60px 20px 100px;
    background:var(--bg-soft);
    border-top:1px solid var(--border);
  }
  .catalog-inner{
    max-width:1200px;
    margin:0 auto;
  }
  .catalog-title{
    text-align:center;
    font-size:1.8rem;
    font-weight:400;
    letter-spacing:1px;
    margin-bottom:8px;
  }
  .catalog-sub{
    text-align:center;
    font-family:Arial,sans-serif;
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:50px;
  }

  .catalog-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:28px;
  }
  .shop-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .2s ease, border-color .2s ease;
  }
  .shop-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
  }
  .shop-card img{
    width:100%;
    height:280px;
    object-fit:cover;
    display:block;
  }
  .shop-card .info{
    padding:16px 18px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .shop-card .name{
    font-size:1.05rem;
    letter-spacing:0.5px;
  }
  .shop-card .price{
    font-family:Arial,sans-serif;
    color:var(--accent-soft);
    font-size:0.95rem;
  }
  .buy-btn{
    margin-top:auto;
    display:inline-block;
    text-align:center;
    font-family:Arial,sans-serif;
    font-size:0.8rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:12px 16px;
    border:1px solid var(--accent);
    border-radius:6px;
    color:var(--accent);
    transition:background .2s ease, color .2s ease;
  }
  .buy-btn:hover{
    background:var(--accent);
    color:#141414;
  }

  footer{
    text-align:center;
    padding:40px 20px;
    font-family:Arial,sans-serif;
    color:var(--muted);
    font-size:0.8rem;
    letter-spacing:1px;
  }

  @media (max-width:640px){
    h1{font-size:1.9rem;}
    .nav-btn{display:none;}
    .card{width:150px;}
    .card img{height:220px;}
  }
</style>
</head>
<body>

  <header>
    <img src="images/Logo_Black.png" alt="Presetrix" class="logo">
    <div class="eyebrow">Mobile & Desktop Lightroom Presets</div>
    <h1>Presetrix</h1>
    <p>Готовые пресеты для любого настроения кадра — от свадеб до концертов. Выбирайте пак и переходите на Etsy для покупки.</p>
  </header>

  <section class="carousel-section">
    <div class="carousel-wrap" id="carouselWrap">
      <button class="nav-btn nav-left" aria-label="Назад">&#10094;</button>
      <div class="carousel" id="carousel"></div>
      <button class="nav-btn nav-right" aria-label="Вперёд">&#10095;</button>
    </div>
  </section>

  <section class="catalog-section">
    <div class="catalog-inner">
      <div class="catalog-title">Все паки</div>
      <div class="catalog-sub">Нажмите «Купить на Etsy», чтобы перейти к оплате</div>
      <div class="catalog-grid" id="catalogGrid"></div>
    </div>
  </section>

  <footer>© Presetrix — все пресеты продаются на Etsy</footer>

  <script src="packs-data.js"></script>
  <script>
    // ---------- Render carousel (showcase, uses all packs) ----------
    const carousel = document.getElementById('carousel');
    PACKS.forEach(pack => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = pack.etsyUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <img src="images/${pack.image}" alt="${pack.name}">
        <div class="label">${pack.name}</div>
      `;
      carousel.appendChild(a);
    });

    // ---------- Render full catalog grid (auto-grows with PACKS) ----------
    const catalogGrid = document.getElementById('catalogGrid');
    PACKS.forEach(pack => {
      const card = document.createElement('div');
      card.className = 'shop-card';
      card.innerHTML = `
        <img src="images/${pack.image}" alt="${pack.name}">
        <div class="info">
          <div class="name">${pack.name}</div>
          <div class="price">${pack.price}</div>
          <a class="buy-btn" href="${pack.etsyUrl}" target="_blank" rel="noopener">Купить на Etsy</a>
        </div>
      `;
      catalogGrid.appendChild(card);
    });

    // ---------- Follow-the-cursor scrolling for hero carousel ----------
    const wrap = document.getElementById('carouselWrap');
    let mouseActive = false;
    const DEAD_ZONE = 0.12;
    const MAX_SPEED = 18;

    wrap.addEventListener('mousemove', (e) => {
      mouseActive = true;
      const rect = wrap.getBoundingClientRect();
      const relX = (e.clientX - rect.left) / rect.width;
      const center = relX - 0.5;
      let speed = 0;
      if (Math.abs(center) > DEAD_ZONE / 2) {
        const sign = center > 0 ? 1 : -1;
        const strength = (Math.abs(center) - DEAD_ZONE / 2) / (0.5 - DEAD_ZONE / 2);
        speed = sign * strength * MAX_SPEED;
      }
      carousel.dataset.speed = speed;
    });
    wrap.addEventListener('mouseleave', () => {
      mouseActive = false;
      carousel.dataset.speed = 0;
    });

    function tick(){
      const speed = parseFloat(carousel.dataset.speed || 0);
      if (mouseActive && speed !== 0) {
        const max = carousel.scrollWidth - carousel.clientWidth;
        carousel.scrollLeft = Math.min(Math.max(carousel.scrollLeft + speed, 0), max);
      }
      requestAnimationFrame(tick);
    }
    carousel.dataset.speed = 0;
    tick();

    const cardWidth = 224;
    document.querySelector('.nav-left').addEventListener('click', () => {
      carousel.scrollBy({left: -cardWidth * 2, behavior:'smooth'});
    });
    document.querySelector('.nav-right').addEventListener('click', () => {
      carousel.scrollBy({left: cardWidth * 2, behavior:'smooth'});
    });
  </script>

</body>
</html>
